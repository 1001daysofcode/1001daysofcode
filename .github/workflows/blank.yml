name: Generate profile skyline

on:
  schedule:
    - cron: '17 2 * * *'
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: write

jobs:
  profile-3d:
    runs-on: ubuntu-latest
    name: Generate 3D contribution SVG
    steps:
      - uses: actions/checkout@v4
      - uses: yoshi389111/github-profile-3d-contrib@latest
        env:
          USERNAME: 1001daysofcode
      - uses: stefanzweifel/git-auto-commit-action@v6
        with:
          commit_message: 'chore: refresh contribution skyline'
          file_pattern: 'profile-3d-contrib/*.svg'
